[package]
name = "gavno-settings"
description = "Live display and keyboard settings for GAVNO"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gio = "0.21"
glib = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"
futures-channel = "0.3"
