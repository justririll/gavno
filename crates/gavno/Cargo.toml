[package]
name = "gavno"
description = "GAVNO: a lightweight hybrid Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags = "2.2.1"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
xcursor = "0.3.3"
fontdue = "0.9"
png = "0.17"
resvg = { version = "0.45", default-features = false }
libc = "0.2"
zeroize = "1.9"
zbus = "5.19"
async-channel = "2"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", tag = "v0.7.0", default-features = false }
# Same version as drm-rs uses; needed for a connector query that never probes.
drm-ffi = "0.9"
# Wire protocol only; the camera and inference runtime stay in the helper binary.
gavno-cam-proto = { path = "../gavno-cam-proto" }
# Action and context types of the local AI helper; the model, HTTP and systemd code stays in that binary.
gavno-ai = { path = "../gavno-ai" }

wayland-protocols = { version = "0.32", features = ["server", "staging"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "backend_egl",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
]

# Exercise the real Smithay one-shot idle timers over an in-process socket.
# These crates are already part of Smithay's dependency graph.
[dev-dependencies]
wayland-client = "0.31.10"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
