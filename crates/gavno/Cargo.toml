[package]
name = "gavno"
description = "GAVNO: a lightweight hybrid Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags = "2.2.1"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
xcursor = "0.3.3"
fontdue = "0.9"
libc = "0.2"
serde_json = "1"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", tag = "v0.7.0", default-features = false }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "backend_egl",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
]
