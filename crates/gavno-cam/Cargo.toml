[package]
name = "gavno-cam"
description = "GAVNO webcam finger pointer: hand tracking helper process"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gavno-cam"
path = "src/main.rs"
required-features = ["runtime"]

[features]
# The camera and inference runtime; the compositor depends on the protocol and
# gesture code only (default-features = false).
default = ["runtime"]
runtime = ["dep:gstreamer", "dep:gstreamer-app", "dep:tract-onnx", "dep:libc"]

[dependencies]
gavno-cam-proto = { path = "../gavno-cam-proto" }
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
tract-onnx = { version = "0.23", optional = true }
libc = { version = "0.2", optional = true }
