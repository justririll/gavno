# Matches the GAVNO dark theme.
[main]
font=IBM Plex Mono:size=10.5
font-bold=IBM Plex Mono:weight=SemiBold:size=10.5
line-height=14
pad=14x12 center
title=Terminal
locked-title=no
resize-delay-ms=50

[scrollback]
lines=20000

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

