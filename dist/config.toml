# GAVNO configuration file.
#
# GAVNO looks for this file at $GAVNO_CONFIG if that variable is set, otherwise
# at $XDG_CONFIG_HOME/gavno/config.toml, otherwise at
# $HOME/.config/gavno/config.toml.
#
# Every key is optional: omitted keys keep the built-in default shown below.
# Uncomment a setting to override its default.
# The GAVNO_* environment variables (GAVNO_MOD, GAVNO_TERMINAL, GAVNO_LAUNCHER,
# GAVNO_SCALE, GAVNO_XKB_LAYOUT, GAVNO_XKB_VARIANT, GAVNO_XKB_OPTIONS) take
# precedence over this file. Unknown keys are ignored with a warning, and a
# malformed file is ignored as a whole; GAVNO still starts.

# Modifier for compositor key bindings: "super" or "alt".
# Default: "super"; when running nested (--winit) the default is "alt",
# because the host compositor keeps Super for itself.
# mod_key = "super"

# Terminal started by Mod+Return.
# terminal = "foot"

# Launcher started by Mod+D. Default: none (binding disabled).
# Uncomment to enable it with fuzzel.
# launcher = "fuzzel"

# Gap between a new window and the work area edge, in logical pixels.
# Values outside 0..=64 are clamped. Default: 12.
# gap = 12

# [output]
# Scale for built-in panels (eDP). External outputs always use 1.0.
# Values outside 0.5..=4.0 are clamped. Default: 1.75.
# internal_scale = 1.75

# Preferred mode by default. To request the built-in panel at 120 Hz, add:
# mode = "2880x1620@120"
# Omit @HZ to select the highest refresh at that resolution.
# HDR defaults to off; unsupported hardware falls back to SDR with a warning.
# hdr = false
# SDR content white in HDR mode, clamped to 80..=400 cd/m².
# sdr_white_nits = 203

# [keyboard]
# Key repeat applies to clients and hardware media keys; 0 Hz disables it.
# repeat_delay = 300
# repeat_rate = 30
# XKB layout(s) passed to the seat keyboard. Default: "us,ru".
# layout = "us,ru"

# XKB variant(s), one per layout, or "" for none. Default: "".
# variant = ""

# XKB options; set to "" to disable them. Default: "grp:alt_shift_toggle".
# options = "grp:alt_shift_toggle"

# Start in keyboard-only code mode (Mod+Shift+C toggles it).
# code_mode = false

# Show the key hint strip next to the code-mode chip. Default: true.
# bar_hints = true

# Built-in dock and top bar. Pin changes made in the dock menu last until exit.
# [dock]
# enabled = true
# pinned = ["foot", "firefox"]
# magnify = true
# autohide = false
# icon_theme = "Adwaita"
# [bar]
# enabled = true

# [tiling]
# default = false

# [display]
# off_after_idle_secs = 600 # 0 disables automatic output power-off, independently of locking.
# night_light = true # Warm the HDR white point in the evening (follows the sun).
# night_light_temperature = 3400 # Kelvin at full strength, 1900-6500.

# [lock]
# after_idle_secs = 300 # 0 disables automatic locking; idle inhibitors are respected.

# Built-in Spotify popover (requires the org.gavno.Music daemon).
# Click the media title/artist, or the music icon when no player is active.
# Disable to retain the old media capsule click behavior.
# [media]
# music_panel = true

# Webcam finger pointer (Mod+Shift+M). The camera runs only while it is on.
# [pointer]
# camera = true      # false frees the chord and stops a running pointer
# active_box = 70    # % of the mirrored camera frame that maps to the screen
# min_cutoff = 1.0   # smoothing while the finger is slow (Hz)
# beta = 0.01        # less lag during fast moves

# Local sun/season colors. These settings reload live.
# [theme]
# background = "living" # or "solid"
# solid_color = "#0e1016"
# accent = "living" # or a fixed "#rrggbb"
# app_color_scheme = "dark" # what apps see via the Settings portal: "dark", "light" or "none"
# Coordinates are optional: file > GAVNO_LAT/GAVNO_LON > time-zone guess.
# Latitude range: -90..90. Longitude range: -180..180.
# Omit each coordinate to use the time zone (or its environment fallback).
# [modules]
# theme = true
